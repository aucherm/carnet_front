services:
  react-prod:
    build:
      context: .
      dockerfile: Containerfile
    image: carnet-prod
    ports:
      - "8080:8080"

  react-dev:
    build:
      context: .
      dockerfile: Containerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://host-gateway:8081
    extra_hosts:
      - "host-gateway:host-gateway"
    develop:
      watch:
        - action: sync
          path: .
          target: /app